<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edmark Magsalin is a web developer with years of professional freelance and corporate experience in maintaining and building websites and webapps." />
    <title>Edmark Magsalin | Web Developer</title>
    <script>
      // This is here to avoid Flash of Unstyled Content or FOUC
      (() => {
        const theme = localStorage.getItem("theme");
        if(theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
